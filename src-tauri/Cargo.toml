[workspace]
members = ["broker-core"]
resolver = "2"

[package]
name = "rhodiz-harness-desktop"
version = "0.1.0"
description = "RHODIZ Harness Desktop"
authors = ["RHODIZ"]
publish = false
edition = "2021"
# Tracks broker-core, which ed25519-dalek 3.0.0 holds at 1.85. This crate
# depends on broker-core, so a lower figure here would be a minimum the
# build cannot actually satisfy.
rust-version = "1.85"

[lib]
name = "rhodiz_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
rhodiz-harness-broker-core = { path = "broker-core" }
tauri = { version = "=2.11.5" }
wait-timeout = "=0.2.1"
