[workspace]
members = ["broker-core"]
resolver = "2"

[package]
name = "rhodiz-harness-desktop"
version = "0.1.0"
description = "RHODIZ Harness Desktop"
authors = ["RHODIZ"]
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rhodiz_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
rhodiz-harness-broker-core = { path = "broker-core" }
tauri = { version = "=2.11.5" }
