name: Desktop CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A real Windows 11 capture now lives in evidence/windows/, so its absence is
  # a regression rather than a known gap: deleting the capture must turn CI red
  # instead of quietly restoring "no evidence, no opinion". Left unset locally,
  # where a contributor with no captures is not doing anything wrong.
  RHODIZ_REQUIRE_WSL_EVIDENCE: '1'

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable gates (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Verify portable stack
        run: npm run verify:portable

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
      - name: Check whitespace
        shell: bash
        run: |
          base="$(git merge-base HEAD origin/main)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$base" HEAD
          fi

  windows:
    name: Windows Tauri check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustup override set 1.98.1

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse and smoke-test the WSL evidence probe
        shell: pwsh
        run: |
          $script = 'scripts/windows-evidence/probe-wsl.ps1'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script), [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "$script does not parse"
          }

          # Execute it for real. This runner has no WSL install, so the capture
          # exercises the absent/not-probeable route end to end; the point is
          # that the script runs on Windows and emits a well-formed capture
          # before an operator is asked to run it on their own machine.
          & $script -Label ci-smoke -OutFile "$env:RUNNER_TEMP/wsl-probe-ci-smoke.json"

          $capture = Get-Content "$env:RUNNER_TEMP/wsl-probe-ci-smoke.json" -Raw | ConvertFrom-Json
          if ($capture.schema -ne 'rhodiz.harness.windows-evidence/wsl-probe/1') {
            throw "capture carries an unexpected schema: $($capture.schema)"
          }

          # Feed it to the replay test, proving the Windows producer and the
          # Rust consumer agree on the format. The capture stays in the runner
          # workspace: it is a smoke test, never committed as host evidence.
          Copy-Item "$env:RUNNER_TEMP/wsl-probe-ci-smoke.json" evidence/windows/
          cargo test --manifest-path src-tauri/Cargo.toml -p rhodiz-harness-broker-core --test wsl_evidence_replay -- --nocapture
          Remove-Item evidence/windows/wsl-probe-ci-smoke.json

      - name: Verify Windows stack
        run: npm run verify:windows

  windows-build:
    name: Windows build (MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: windows
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustup override set 1.98.1

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri app
        shell: pwsh
        run: npm run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e9274886f1340735a8
        with:
          name: rhodiz-harness-desktop-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
